# Firestore security rules and indexes (firestore.rules, firestore.indexes.json).
#
# Checks: the rules tests in rules_test/, against the Firestore emulator.
# Release: push a tag firebase-v<version> (scripts\release.ps1 -Component firebase)
# to deploy the rules and indexes to the project. Deploy them before releasing an
# app or web version that needs them. Setup: docs/releasing.md.
name: Firebase

on:
  push:
    branches: [main, develop]
    paths:
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - 'firebase.json'
      - 'rules_test/**'
      - '.github/workflows/firebase.yml'
    tags: ['firebase-v*']
  pull_request:
    paths:
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - 'firebase.json'
      - 'rules_test/**'
      - '.github/workflows/firebase.yml'
  workflow_dispatch:

env:
  FIREBASE_PROJECT: capsula-ygtech

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install -g firebase-tools@13
      - name: Rules tests
        working-directory: rules_test
        run: |
          npm ci
          npm test

  release:
    if: startsWith(github.ref, 'refs/tags/firebase-v')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Deploy rules and indexes
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SERVICE_ACCOUNT" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT is not set (docs/releasing.md)."
            exit 1
          fi
          echo "$SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx --yes firebase-tools@13 deploy \
            --only firestore:rules,firestore:indexes \
            --project "$FIREBASE_PROJECT" \
            --non-interactive
      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Firebase rules ${{ github.ref_name }}
          generate_release_notes: true
