# Android app (app/).
#
# Checks: on changes to the app or the shared package.
# Release: push a tag app-v<version> (scripts\release.ps1 -Component app). Builds a
# signed APK and App Bundle, attaches them to a GitHub release and, when configured,
# sends the APK to testers through Firebase App Distribution.
# Secrets and setup: docs/releasing.md.
name: App

on:
  push:
    branches: [main, develop]
    paths:
      - 'app/**'
      - 'packages/**'
      - '.github/workflows/app.yml'
    tags: ['app-v*']
  pull_request:
    paths:
      - 'app/**'
      - 'packages/**'
      - '.github/workflows/app.yml'
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.47.7'

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  release:
    if: startsWith(github.ref, 'refs/tags/app-v')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches app/pubspec.yaml
        id: version
        run: |
          tag="${GITHUB_REF_NAME#app-v}"
          pubspec=$(grep -E '^version:' pubspec.yaml | sed -E 's/version: *([^+ ]+).*/\1/')
          if [ "$tag" != "$pubspec" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match app/pubspec.yaml version $pubspec"
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Set up release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set. Releases must be signed with the upload key (docs/releasing.md)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/upload.jks
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=${KEY_ALIAS:-upload}
          storeFile=../upload.jks
          EOF

      # The build number only ever goes up: this workflow's run number.
      - name: Build
        run: |
          flutter pub get
          args="--release --build-name=${{ steps.version.outputs.version }} --build-number=${{ github.run_number }} --dart-define-from-file=config/prod.json"
          flutter build apk $args
          flutter build appbundle $args
          mkdir -p ../dist
          cp build/app/outputs/flutter-apk/app-release.apk "../dist/capsula-${{ steps.version.outputs.version }}.apk"
          cp build/app/outputs/bundle/release/app-release.aab "../dist/capsula-${{ steps.version.outputs.version }}.aab"

      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: App ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: dist/*

      - name: Send to testers (Firebase App Distribution)
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          TESTER_GROUPS: ${{ vars.FIREBASE_TESTER_GROUPS }}
        if: env.SERVICE_ACCOUNT != ''
        run: |
          echo "$SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          app_id=$(grep -o '"FIREBASE_ANDROID_APP_ID": *"[^"]*"' config/prod.json | sed -E 's/.*"([^"]+)"$/\1/')
          npx --yes firebase-tools@13 appdistribution:distribute \
            "../dist/capsula-${{ steps.version.outputs.version }}.apk" \
            --app "$app_id" \
            --groups "${TESTER_GROUPS:-testers}" \
            --release-notes "Capsula ${{ steps.version.outputs.version }}"
