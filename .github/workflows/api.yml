# API server (api/).
#
# Checks: on changes to the server or the shared package.
# Release: push a tag api-v<version> (scripts\release.ps1 -Component api). Builds
# the Docker image and publishes it to GitHub Container Registry as
# ghcr.io/<owner>/capsula-api:<version> and :latest, with a GitHub release.
# Running it: docs/hosting.md. Setup: docs/releasing.md.
name: API

on:
  push:
    branches: [main, develop]
    paths:
      - 'api/**'
      - 'packages/**'
      - '.github/workflows/api.yml'
    tags: ['api-v*']
  pull_request:
    paths:
      - 'api/**'
      - 'packages/**'
      - '.github/workflows/api.yml'
  workflow_dispatch:

env:
  DART_VERSION: '3.13.5'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ env.DART_VERSION }}
      - name: Shared package
        working-directory: packages/capsula_core
        run: |
          dart pub get
          dart analyze
      - name: API server
        working-directory: api
        run: |
          dart pub get
          dart analyze
          dart test

  release:
    if: startsWith(github.ref, 'refs/tags/api-v')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches api/pubspec.yaml
        id: version
        run: |
          tag="${GITHUB_REF_NAME#api-v}"
          pubspec=$(grep -E '^version:' api/pubspec.yaml | sed -E 's/version: *([^+ ]+).*/\1/')
          if [ "$tag" != "$pubspec" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match api/pubspec.yaml version $pubspec"
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"
          # Image names must be lower case.
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/capsula-api" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: api/Dockerfile
          push: true
          tags: |
            ${{ steps.version.outputs.image }}:${{ steps.version.outputs.version }}
            ${{ steps.version.outputs.image }}:latest

      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: API ${{ steps.version.outputs.version }}
          generate_release_notes: true
          body: |
            Docker image: `${{ steps.version.outputs.image }}:${{ steps.version.outputs.version }}`

            ```
            docker pull ${{ steps.version.outputs.image }}:${{ steps.version.outputs.version }}
            ```
