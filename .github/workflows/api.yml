# API server (api/).
#
# Checks: on changes to the server or the shared package.
# Release: push a tag api-v<version> (scripts\release.ps1 -Component api). Builds
# the Docker image and publishes it to GitHub Container Registry as
# ghcr.io/<owner>/capsula-api:<version> and :latest, with a GitHub release.
# Then, when the variable VPS_HOST is set, deploys it to your server (deploy/vps).
# Running it: docs/hosting.md. Setup: docs/releasing.md.
name: API

on:
  push:
    branches: [main, develop]
    paths:
      - 'api/**'
      - 'packages/**'
      - '.github/workflows/api.yml'
      - 'deploy/vps/**'
    tags: ['api-v*']
  pull_request:
    paths:
      - 'api/**'
      - 'packages/**'
      - '.github/workflows/api.yml'
      - 'deploy/vps/**'
  workflow_dispatch:

env:
  DART_VERSION: '3.13.5'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ env.DART_VERSION }}
      - name: Shared package
        working-directory: packages/capsula_core
        run: |
          dart pub get
          dart analyze
      - name: API server
        working-directory: api
        run: |
          dart pub get
          dart analyze
          dart test
      - name: Server files
        working-directory: deploy/vps
        run: |
          shellcheck setup.sh deploy.sh
          cp env.example .env
          mkdir -p secrets && echo '{}' > secrets/service-account.json
          docker compose config --quiet
          docker run --rm -e API_DOMAIN=api.example.com -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.8 caddy validate --config /etc/caddy/Caddyfile

  release:
    if: startsWith(github.ref, 'refs/tags/api-v')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches api/pubspec.yaml
        id: version
        run: |
          tag="${GITHUB_REF_NAME#api-v}"
          pubspec=$(grep -E '^version:' api/pubspec.yaml | sed -E 's/version: *([^+ ]+).*/\1/')
          if [ "$tag" != "$pubspec" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match api/pubspec.yaml version $pubspec"
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"
          # Image names must be lower case.
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/capsula-api" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: api/Dockerfile
          push: true
          tags: |
            ${{ steps.version.outputs.image }}:${{ steps.version.outputs.version }}
            ${{ steps.version.outputs.image }}:latest

      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: API ${{ steps.version.outputs.version }}
          generate_release_notes: true
          body: |
            Docker image: `${{ steps.version.outputs.image }}:${{ steps.version.outputs.version }}`

            ```
            docker pull ${{ steps.version.outputs.image }}:${{ steps.version.outputs.version }}
            ```

  # Deploys the new image to your own server (deploy/vps). Runs only when the
  # repository variable VPS_HOST is set. Setup: docs/hosting.md#option-a-your-own-server.
  deploy:
    if: startsWith(github.ref, 'refs/tags/api-v') && vars.VPS_HOST != ''
    needs: release
    runs-on: ubuntu-latest
    environment: production
    concurrency: { group: api-deploy, cancel-in-progress: false }
    permissions:
      contents: read
      packages: read
    env:
      HOST: ${{ vars.VPS_HOST }}
      DEPLOY_USER: ${{ vars.VPS_USER || 'capsula' }}
    steps:
      - uses: actions/checkout@v4

      - name: SSH key
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          if [ -z "$SSH_KEY" ]; then echo "::error::Secret VPS_SSH_KEY is not set"; exit 1; fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          if [ -n "$KNOWN_HOSTS" ]; then
            printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
            check=yes
          else
            echo "::warning::Secret VPS_KNOWN_HOSTS is not set; trusting the server's key on first contact"
            check=accept-new
          fi
          cat > ~/.ssh/config <<CONFIG
          Host vps
            HostName $HOST
            User $DEPLOY_USER
            IdentityFile ~/.ssh/id_deploy
            StrictHostKeyChecking $check
          CONFIG

      - name: Copy the server files
        run: scp deploy/vps/compose.yaml deploy/vps/Caddyfile deploy/vps/deploy.sh deploy/vps/env.example vps:/opt/capsula/

      - name: Deploy
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#api-v}"
          # Sign in to the registry for this pull only (the image may be private).
          echo "$TOKEN" | ssh vps docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          status=0
          ssh vps "chmod 750 /opt/capsula/deploy.sh && /opt/capsula/deploy.sh '$version'" || status=$?
          ssh vps docker logout ghcr.io || true
          exit $status

      - name: Check it answers
        run: |
          domain=$(ssh vps "grep '^API_DOMAIN=' /opt/capsula/.env | cut -d= -f2")
          curl --fail --silent --show-error --retry 5 --retry-delay 3 "https://$domain/v1/health"
